name: Deploy Backend to HuggingFace

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://SearingShot:${HF_TOKEN}@huggingface.co/spaces/SearingShot/careflow-ai-backend hf-space

      - name: Sync backend files
        run: |
          rsync -av --delete backend/ hf-space/

      - name: Push to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd hf-space

          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "Auto deploy from GitHub" || echo "No changes to commit"

          git branch -M main

          git remote add hf https://SearingShot:${HF_TOKEN}@huggingface.co/spaces/SearingShot/CareFlow_AI_Backend

          git push hf main --force
